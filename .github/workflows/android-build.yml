name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true
      version_name:
        description: "Release tag/version (e.g. v0.1.0)"
        type: string
        default: "v0.1.0"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Manual dispatch with create_release, or every push to main tagged workflow_dispatch
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: frame-debug-apk
          path: release-assets

      - name: Prepare release assets
        run: |
          mkdir -p out
          APK=$(ls release-assets/*.apk | head -n 1)
          VERSION="${{ inputs.version_name }}"
          cp "$APK" "out/FRAME-${VERSION}-debug.apk"
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_name }}
          name: FRAME ${{ inputs.version_name }}
          body: |
            ## FRAME ${{ inputs.version_name }}

            Offline AI Film Studio for Android (debug build).

            ### Install
            1. Download `FRAME-${{ inputs.version_name }}-debug.apk` below
            2. On your phone: allow **Install unknown apps** for your browser/Files
            3. Open the APK and install

            ### Notes
            - Package id: `com.corelink.frame.debug`
            - AI video generation needs on-device model weights (not bundled yet)
            - Projects, editor, export UI are included

            Built by GitHub Actions from `main`.
          files: out/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
