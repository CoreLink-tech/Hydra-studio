name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true
      version_name:
        description: "Release tag/version (e.g. v0.1.1)"
        type: string
        default: "v0.1.1"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android command-line tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frame-debug-apk
          path: release-assets

      - name: Prepare release assets
        run: |
          mkdir -p out
          APK=$(ls release-assets/*.apk | head -n 1)
          VERSION="${{ inputs.version_name }}"
          cp "$APK" "out/FRAME-${VERSION}-debug.apk"
          ls -la out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_name }}
          name: FRAME ${{ inputs.version_name }}
          body: |
            ## FRAME ${{ inputs.version_name }}

            Debug APK for your phone.

            1. Download the APK
            2. Allow install from unknown sources
            3. Open and install

            Package: `com.corelink.frame.debug`
          files: out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
