name: Release APK on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android command-line tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          rm -rf "$HOME/android-sdk/cmdline-tools/latest"
          mv cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "out/FRAME-${TAG}-debug.apk"
          ls -la out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FRAME ${{ github.ref_name }}
          body: |
            ## FRAME ${{ github.ref_name }}

            Debug APK for sideloading on your phone.

            ### Install
            1. Download `FRAME-${{ github.ref_name }}-debug.apk`
            2. On the phone: allow Install unknown apps for Chrome/Files
            3. Open the APK → Install

            Package: `com.corelink.frame.debug`

            **Note:** AI generation needs model weights (not in this APK yet). Projects, editor, export UI work offline.
          files: out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
