name: Release APK on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "out/FRAME-${TAG}-debug.apk"
          ls -la out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FRAME ${{ github.ref_name }}
          body: |
            ## FRAME ${{ github.ref_name }}

            Debug APK for sideloading.

            **Install**
            1. Download the `.apk` below
            2. On Android: Settings → allow install from this source
            3. Open the file and install

            App id: `com.corelink.frame.debug`

            AI generation requires model weights (not included). UI, projects, editor, and export pipeline are included.
          files: out/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
